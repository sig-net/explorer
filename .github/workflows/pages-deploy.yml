# Deploys the explorer to GitHub Pages when a release tag vX.Y.Z is pushed. The tag must point at a
# commit on main: main is what is live, and tagging it is the release. Pages holds one site, so
# every deploy replaces the one before it.
#
# The build takes its base path from the Pages site itself: /explorer/ under
# sig-net.github.io, / once the site has a custom domain. GitHub Pages serves 404.html for any
# path that is not a file, so a copy of index.html under that name lets a deep link such as
# /explorer/midnight/explorer?requestId=... load the app, which then routes it.
#
# Dependencies are not cached between runs: a deploy job must not consume a poisonable cache.

name: pages-deploy

on:
  push:
    tags:
      # Digits only, so a suffixed tag such as v1.2.0-rc.1 starts no run.
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, never cancelled: a superseded run would leave a half-published site.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  verify-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Refuse a ref that is not a release tag
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ] ||
            ! printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::pages-deploy runs on a vX.Y.Z tag only, got $GITHUB_REF_TYPE $GITHUB_REF_NAME"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the guard below asks whether the tagged commit is on main.
          fetch-depth: 0
          persist-credentials: false
      - name: The tag must point at a commit on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::tag $GITHUB_REF_NAME is not on main"
            exit 1
          }

  build:
    needs: verify-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # Reads the Pages site's base path.
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies (frozen, from the committed yarn.lock)
        run: corepack enable && yarn install --immutable
      - run: yarn lint
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build for the site's base path
        env:
          # base_path carries no trailing slash, and is empty at a domain root.
          EXPLORER_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: yarn build
      - name: Serve the app for every path that is not a file
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      # The deployment is authenticated by this run's OIDC token.
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
