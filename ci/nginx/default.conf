server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /srv/explorer;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    # An ingress in front of the pod makes every request a proxied one, which nginx serves
    # uncompressed under the default gzip_proxied off.
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/javascript application/javascript application/json
               image/svg+xml application/wasm;

    # The image build writes .gz siblings, so the WebAssembly modules that make up most of the
    # payload are never compressed per request.
    gzip_static on;

    location = /healthz {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store";
        default_type text/plain;
        return 200 "ok\n";
    }

    # The build content hashes these names, so a miss here is deploy skew. Falling through to
    # index.html would answer a missing chunk with HTML and a 200, which reaches the browser as a
    # MIME type error and hides the real cause. Adding `always` to the Cache-Control below would
    # put a year of immutability on that 404.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # These names are stable across builds, so a long or immutable cache would pin a stale icon.
    location /icons/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /favicon.svg {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Every client-side route resolves through this one file, and it carries the hashed asset
    # names, so a deployment only takes effect once a client stops reusing a cached copy.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
