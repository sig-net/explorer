# A block that declares any add_header of its own discards every add_header it would inherit from
# its parent. Each location that sets Cache-Control therefore has to restate these three, so they
# live here and are included at every level that needs them.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
