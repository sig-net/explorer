nodeLinker: node-modules

# Both peers are satisfied by hoisted transitive dependencies (Vite ships rolldown,
# @tanstack/react-router ships router-core), so the workspace need not declare them.
packageExtensions:
  '@rolldown/plugin-babel@*':
    peerDependenciesMeta:
      rolldown:
        optional: true
  '@tanstack/router-devtools-core@*':
    peerDependenciesMeta:
      '@tanstack/router-core':
        optional: true
