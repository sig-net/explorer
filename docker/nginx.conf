# Serves the built explorer from /usr/share/nginx/html as a single page application.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build output never changes under its name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The entry page and the runtime configuration change between deployments.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /env.js {
        add_header Cache-Control "no-cache";
    }

    # Every path that is not a file is a route of the app.
    location / {
        try_files $uri /index.html;
    }
}
